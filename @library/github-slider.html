<div @name="github-slider" class="slider github-slider { class }">
  <a
    href="https://github.com/{ item.name }"
    :for="item in items"
    class="slider-item"
    target="_blank"
    aria-label="{ item.name }"
  >
    >
    <img
      src="{ item.src }"
      width="{ item.width }"
      height="{ item.height }"
      loading="lazy"
      alt="{ item.name }"
    />
    <span class="tooltip">{ item.name }</span>
  </a>
</div>
