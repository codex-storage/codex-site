<div @name="video-player" class="video-player">
  <icon src="icon/header/play.svg"></icon>

  <dialog>
    <video
      controls
      poster="{ poster }"
      preload="metadata"
      playsinline
      width="100%"
      height="auto"
    >
      <source src="{ src }" type="video/mp4" />
      Your browser does not support the video tag.
    </video>
  </dialog>
</div>
