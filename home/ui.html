<section @name="ui" class="ui fluid">
  <header>
    <p>USER INTERFACE [+]</p>
    <span>05</span>
  </header>
  <main>
    <div>
      <div class="app-logo">
        <icon src="/icon/ui/logo.svg" />
        <div>
          <h2>Vault</h2>
          <icon src="/icon/ui/alpha.svg" />
          <small>{app.version}</small>
        </div>
        <icon src="/icon/ui/red.svg" />
      </div>

      <div class="content">
        <h3>
          Begin your journey
          <div>with Codex.</div>
        </h3>
        <b>Explore the vault</b>
        <p>
          Codex Vault is the official Node management and Marketplace software
          designed for both hosts and users.
        </p>

        <div class="icons">
          <icon src="/icon/ui/icon-1.svg" />
          <icon src="/icon/ui/icon-2.svg" />
        </div>

        <a href="/docs/ui"> Access Codex Vault </a>
      </div>
    </div>
    <div>
      <img
        src="/img/ui/phone.png"
        alt="Codex app"
        loading="lazy"
        class="phone"
      />
      <img
        src="/img/ui/laptop.png"
        alt="Codex app"
        loading="lazy"
        class="laptop"
      />
    </div>
  </main>
</section>
