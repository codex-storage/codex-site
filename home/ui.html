<section @name="ui" class="ui fluid" data-speed="0.7">
  <header>
    <p>USER INTERFACE [+]</p>
    <span>05</span>
  </header>
  <main>
    <div>
      <div class="app-logo">
        <icon src="/icon/ui/logo.svg" />
        <div>
          <h2>Vault</h2>
          <icon src="/icon/ui/alpha.svg" />
          <small>{app.version}</small>
        </div>
        <icon src="/icon/ui/red.svg" />
      </div>

      <div class="content">
        <h3>
          Begin your journey
          <div>with Codex.</div>
        </h3>
        <b>Explore the vault</b>
        <p>
          Codex Vault is the official Node management and Marketplace software
          designed for both hosts and users.
        </p>

        <div class="icons">
          <icon src="/icon/ui/icon-1.svg" />
          <icon src="/icon/ui/icon-2.svg" />
        </div>

        <a href="/docs/ui"> Access Codex Vault </a>
      </div>
    </div>
    <div>
      <picture>
        <source
          srcset="/img/ui/phone.webp"
          media="(min-width: 801px)"
          type="image/webp"
        />
        <source
          srcset="/img/ui/phone-mobile.webp"
          type="image/webp"
          media="(max-width: 800px)"
        />
        <img
          src="/img/ui/phone-mobile.webp"
          alt="Codex app"
          loading="lazy"
          class="phone"
          height="416"
          width="171"
        />
      </picture>

      <picture>
        <source
          srcset="/img/ui/laptop.webp"
          media="(min-width: 801px)"
          type="image/webp"
        />
        <source
          srcset="/img/ui/laptop-mobile.webp"
          type="image/webp"
          media="(max-width: 800px)"
        />
        <img
          src="/img/ui/laptop-mobile.webp"
          alt="Codex app"
          loading="lazy"
          class="laptop"
          width="172"
          height="416"
        />
      </picture>
    </div>
  </main>
  <img
    src="/img/ui/ui.webp"
    alt="Codex App Image"
    loading="lazy"
    class="ui-background"
  />
</section>
