<section id="contributors" @name="contribution" class="contribution fluid">
  <header>
    <p>CONTRIBUTORS [-]</p>
    <span>07</span>
  </header>

  <main>
    <div>
      <h3>Contribute to Codex</h3>
      <p>
        Codex is an <b>open source</b> initiative in which anyone can get
        involved
      </p>
    </div>

    <div class="contributors">
      <github-slider :items="contribution.people"></github-slider>
    </div>

    <p>There is No Web3 Without Truly <b>Decentralized</b> Storage</p>
  </main>
  <footer>
    <a
      class="all-contributors"
      href="https://github.com/codex-storage/nim-codex/graphs/contributors"
      >View Contributors 🡪</a
    >
    <navi :items="contribution.links" />
  </footer>

  <img
    src="/img/disk.webp"
    alt="Disk"
    class="parallax-background"
    loading="lazy"
    width="503"
    height="503"
  />
</section>
