<section @name="usecases" class="usecases fluid">
  <header>
    <p>USECASES [-]</p>
    <span>03</span>
  </header>
  <main>
    <ul>
      <li
        :for="usecase, idx in usecases"
        data-index="{ idx }"
        class="li-initial{ idx }"
      >
        <div>
          <icon src="{ usecase.icon }" />
          <span>{ usecase.category }</span>
        </div>
      </li>
    </ul>
    <div class="embla">
      <div>
        <div
          :for="usecase, idx in usecases"
          id="content-{ idx }"
          class="content initial{ idx }"
        >
          <header>
            <h2>{ usecase.title }</h2>
          </header>
          <main>
            <p>{ usecase.description1 }</p>
            <p>{ usecase.description2 }</p>
          </main>
          <footer>
            <icon src="{ usecase.icon }" />
          </footer>
        </div>
      </div>
      <div class="controls">
        <div class="buttons">
          <button id="embla-prev" type="button" disabled="">
            <icon src="icon/usecases/embla-arrow-left.svg"></icon></button
          ><button id="embla-next" type="button" disabled="">
            <icon src="icon/usecases/embla-arrow-right.svg"></icon>
          </button>
        </div>
        <div id="embla-dots" class="dots"></div>
      </div>
    </div>
  </main>
  <footer>
    <h3>
      <div>Decentralized Storage</div>
      <div>Applications</div>
    </h3>
    <a href=""
      >Explore More <icon src="icon/usecases/arrow-right.svg"></icon
    ></a>
  </footer>

  <svg
    class="usecase-icon"
    width="16"
    height="14"
    viewBox="0 0 16 14"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      id="path"
      stroke-width="1px"
      stroke="#6ccc93"
      d="M15.5 13V3.25L14 0.25H2L0.5 3.25265V13C0.5 13.4142 0.83579 13.75 1.25 13.75H14.75C15.1642 13.75 15.5 13.4142 15.5 13ZM2 4.75H14V12.25H2V4.75ZM2.927 1.75H13.073L13.823 3.25H2.17775L2.927 1.75ZM10.25 6.25H5.75V7.75H10.25V6.25Z"
      fill="none"
    />
  </svg>
</section>
