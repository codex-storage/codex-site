<section @name="usecases" class="usecases fluid">
  <header>
    <p>USECASES [-]</p>
    <span>03</span>
  </header>
  <main>
    <ul>
      <li
        :for="usecase, idx in usecases"
        data-index="{ idx }"
        class="li-initial{ idx }"
      >
        <div>
          <icon src="{ usecase.icon }" />
          <span>{ usecase.category }</span>
        </div>
      </li>
    </ul>
    <div class="embla">
      <div>
        <div
          :for="usecase, idx in usecases"
          id="content-{ idx }"
          class="content initial{ idx }"
          data-tag="{ usecase.tag }"
        >
          <header>
            <h2>{ usecase.title }</h2>
          </header>
          <main>
            <p>{ usecase.description1 }</p>
            <p>{ usecase.description2 }</p>
          </main>
          <footer>
            <icon src="{ usecase.icon }" />
          </footer>
        </div>
      </div>
      <div class="controls">
        <div id="embla-dots" class="dots"></div>

        <div class="buttons">
          <button
            id="embla-prev"
            type="button"
            disabled=""
            aria-label="previous"
          >
            <icon src="icon/usecases/embla-arrow-left.svg"></icon></button
          ><button id="embla-next" type="button" disabled="" aria-label="next">
            <icon src="icon/usecases/embla-arrow-right.svg"></icon>
          </button>
        </div>
      </div>
    </div>
  </main>
