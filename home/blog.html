<section @name="blog" class="blog">
  <header>
    <p>BLOG [+]</p>
    <span>09</span>
  </header>
  <main>
    <div>
      <h3>Codex Updates</h3>
      <a href="">View all</a>
    </div>

    <div>
      <article id="blog-1" role="main">
        <header>
          <img
            src="{ article1.image }"
            alt="{ article1.title }"
            loading="lazy"
          />
        </header>
        <main>
          <small data-splitting>{ article1.date }</small>
          <h4 data-splitting>{ article1.title }</h4>
          <p data-splitting>{ article1.description }</p>
          <a href="">Read Full</a>
        </main>
      </article>
      <div>
        <article id="blog-2" role="complementary">
          <header>
            <img
              src="{ article2.image }"
              alt="{ article2.title }"
              loading="lazy"
            />
          </header>
          <main>
            <small data-splitting>{ article2.date }</small>
            <div>
              <h5 data-splitting>{ article2.title }</h5>
              <p data-splitting>{ article2.description }</p>
            </div>
          </main>
        </article>
        <article id="blog-3" role="complementary">
          <header>
            <img
              src="{ article3.image }"
              alt="{ article3.title }"
              loading="lazy"
            />
          </header>
          <main>
            <small data-splitting>{ article2.date }</small>
            <h5 data-splitting>{ article2.title }</h5>
            <p data-splitting>{ article2.description }</p>
          </main>
        </article>
      </div>
    </div>
  </main>
</section>
